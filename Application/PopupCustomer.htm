<div id="dvCustomerAdd" style="max-width: 450px; display: none; z-index: 5000; top: 50%; left: 50%; right: auto; position: absolute; background-color: #c6c6c6; border: 2px solid #000; padding: 10px; border-radius: 7px; transform: translate(-50%, -50%);">
    <div class="main-panel" style="min-width:400px;padding-top:10px;">
        <div class="content-wrapper pb-0" style="min-height: 400px;">                        
            <div class="row">
                <div class="card" style="width: 100%;">
                    <div class="card-body">
                        <h1 class="card-title">Add Customer</h1>                        
                        <div class="form-group">
                            <label for="lblCustomerNameAdd">Customer Name *</label>
                            <input type="text" class="form-control" placeholder="Customer Name" id="txtCustomerNameAdd">
                        </div>
                        <div class="form-group">
                            <label for="lblAddressAdd">Customer Address</label>
                            <input type="text" class="form-control" placeholder="Customer Address" id="txtAddressAdd" />

                        </div>
                        <div class="form-group">
                            <label for="lblContactNoAdd">Customer Contact NO</label>
                            <input type="text" class="form-control" placeholder="Customer Contact NO" id="txtContactNoAdd" />

                        </div>
                        <button type="button" id="btnCancelCustomerAdd" class="btn btn-danger" onclick="btnCancelCustomerAdd_Clicked();"> Cancel </button>
                        <button type="button" id="btnSaveCustomerAdd" class="btn btn-success" onclick="btnSaveCustomerAdd_Clicked();"> Save Customer</button>                        
                    </div>
                </div>
            </div>
        </div>        
    </div>
</div>
