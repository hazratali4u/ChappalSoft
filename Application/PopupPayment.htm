<div id="dvPayment" style="max-width: 450px; display: none; z-index: 5000; top: 50%; left: 50%; right: auto; position: absolute; background-color: #c6c6c6; border: 2px solid #000; padding: 10px; border-radius: 7px; transform: translate(-50%, -50%);">
    <div class="main-panel" style="min-width:400px;padding-top:10px;">
        <div class="content-wrapper pb-0" style="min-height: 570px;">
            <div class="row">
                <div class="card" style="width: 100%;">
                    <div class="card-body">
                        <div class="form-group">
                            <label for="lblPaymentMode">Payment Mode *</label>
                            <select id="ddlPaymentMode" class="form-control">
                                <option value="1">Cash</option>
                                <option value="2">Online Transfer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="lblDiscount">Discount</label>
                            <input type="text" class="form-control" placeholder="Discount" onblur="CalculateAmountPaid();" id="txtDiscount" onkeypress="return qtyKepressPayment(this, event);">
                        </div>
                        <div class="form-group">
                            <label id="lblNet">Net Total:0</label>
                        </div>
                        <div class="form-group">
                            <label for="lblAmount">Amount Received *</label>
                            <input type="text" class="form-control" placeholder="Amount Received" onblur="CalculateBalance();" id="txtAmount" onkeypress="return qtyKepressPayment(this, event);">

                        </div>
                        <div class="form-group">
                            <label id="lblBalance">Balance:0</label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="radio" name="rblPrintType" value="1" checked />
                                Auto
                            </label>
                            <label>
                                <input type="radio" name="rblPrintType" value="2" />
                                Popup
                            </label>
                            <label>
                                <input type="radio" name="rblPrintType" value="3" />
                                No-Print
                            </label>
                        </div>
                        <button type="button" id="btnCancelPayment" class="btn btn-danger" onclick="btnCancelPaymentClicked();"> Cancel </button>
                        <button type="button" id="btnSavePayment" class="btn btn-success" onclick="SavePayment();"> Save Payment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
