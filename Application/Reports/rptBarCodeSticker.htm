<div class="col-md-12" style="display:none;" id="printArea">

    <style>
        @media print {

            @page {
                size: 2in 1in; /* Width Height */
                margin: 0;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 2in;
                height: 1in;
            }

            #dvBarCodeSticker {
                width: 2in;
                height: 1in;
                overflow: hidden;
            }

            #tblSticker {
                width: 100%;
                border-collapse: collapse;
            }

                #tblSticker td {
                    padding: 0;
                    margin: 0;
                    text-align: center;
                    vertical-align: middle;
                    font-size: 10px;
                }

                #tblSticker img {
                    width: 100%;
                    height: auto;
                }
        }
    </style>

    <div id="dvBarCodeSticker">
        <table id="tblSticker">
            <tbody id="stickerDetail"></tbody>
        </table>
    </div>

</div>
