<div class="col-md-12" style="display: none;">
    <div id="dvDocumentReport" class="tablesorter">
        <style type="text/css">
            * {
                box-sizing: border-box;
            }
            .dvDocumentReport {
                padding: 10px 5px;
                font-family: 'Arial', sans-serif;
                font-size: 13px;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                text-align: left;
                margin-left: 10px;
                margin-right: 10px;
            }

                .dvDocumentReport h5 {
                    margin: 5px 0;
                    font-size: 14px;
                }
                .dvDocumentReport h6 {
                    margin: 5px 0;
                    font-size: 12px;
                }

                .dvDocumentReport hr {
                    margin: 0;
                    border: 1px solid black;
                }

                .dvDocumentReport .detail-section {
                    margin: 5px 0;
                }

                    .dvDocumentReport .detail-section table {
                        width: 100%;
                    }

                        .dvDocumentReport .detail-section table tr td {
                            font-size: 12px;
                            font-weight: bold;
                            border: 1px solid black;
                            padding: 5px;
                            text-transform: capitalize;
                        }

                .dvDocumentReport label {
                    display: inline;
                }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            h1, h2, h3, h4, h5, h6 {
                font-weight: bold;
                line-height: 1.1;
                color: #000;
                text-transform: capitalize;
            }

            @media print {
                body, html {
                    margin: 0;
                    padding: 0;
                }

                .dvDocumentReport {
                    padding: 0;
                    margin-left: 10px; /* <-- ensures left alignment */
                    margin-right: 10px;
                    text-align: left;
                }
            }

        </style>

        <div class="dvDocumentReport">
            <table>
                <tr>
                    <td style="width: 100%;text-align:center;" colspan="2">
                        <h3><label id="lblHeader"></label></h3>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;">
                        <h5><label id="lblFromDate"></label></h5>
                    </td>
                    <td style="width: 50%;text-align:right;">
                        <h5><label id="lblToDate"></label></h5>
                    </td>
                </tr>                
            </table>
            <table style="border-collapse: collapse; width: 100%;" id="tblDocument">
                <tbody id="documentDetail"></tbody>
            </table>
        </div>
    </div>
</div>
