<div class="col-md-12" style="display: none;">
    <div id="dvSales" class="tablesorter">
        <style type="text/css">
            * {
                box-sizing: border-box;
            }

            .dvSales {
                padding: 10px 5px;
                font-family: 'Arial', sans-serif;
                font-size: 13px;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                text-align: left;
                margin-left: 10px;
                margin-right: 10px;
            }

                .dvSales h5 {
                    margin: 5px 0;
                    font-size: 14px;
                }
                .dvSales h6 {
                    margin: 5px 0;
                    font-size: 12px;
                }

                .dvSales hr {
                    margin: 0;
                    border: 1px solid black;
                }

                .dvSales .detail-section {
                    margin: 5px 0;
                }

                    .dvSales .detail-section table {
                        width: 100%;
                    }

                        .dvSales .detail-section table tr td {
                            font-size: 12px;
                            font-weight: bold;
                            border: 1px solid black;
                            padding: 5px;
                            text-transform: capitalize;
                        }

                .dvSales label {
                    display: inline;
                }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            h1, h2, h3, h4, h5, h6 {
                font-weight: bold;
                line-height: 1.1;
                color: #000;
                text-transform: capitalize;
            }

            @media print {
                body, html {
                    margin: 0;
                    padding: 0;
                }

                .dvSales {
                    padding: 0;
                    margin-left: 10px; /* <-- ensures left alignment */
                    margin-right: 10px;
                    text-align: left;
                }
            }
        </style>

        <div class="dvSales">
            <table>
                <tr>
                    <td style="width: 100%;text-align:center;" colspan="2">
                        <h3><label id="lblHeaderSales"></label></h3>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;">
                        <h5><label id="lblCategorySales"></label></h5>
                    </td>
                    <td style="width: 50%;text-align:right;">
                        <h5><label id="lblFromDateSales"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;">
                        <h5><label id="lblItemSales"></label></h5>
                    </td>
                    <td style="width: 50%;text-align:right;">
                        <h5><label id="lblToDateSales"></label></h5>
                    </td>
                </tr>
            </table>
            <br />
            <table style="border-collapse: collapse; width: 50%;" id="tblSalesSummary">
                <thead>
                    <tr>
                        <td style="width:40%;border: 1px solid black;">
                            <h5><label id="lblColumnName">Date</label> </h5>
                        </td>
                        <td style="width:30%;border: 1px solid black;">
                            <h5>Quantity</h5>
                        </td>
                        <td style="width:30%;border: 1px solid black;">
                            <h5>Amount</h5>
                        </td>
                    </tr>
                </thead>
                <tbody id="itemDetailSales"></tbody>                     
                <tr>
                    <td style="width:40%;border: 1px solid black;text-align:right;">
                        <h4>Total</h4>
                    </td>
                    <td style="width:30%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblQtySaleSummary">0</label></h4>
                    </td>
                    <td style="width:30%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblAmountSaleSummary">0</label></h4>
                    </td>
                </tr>     
            </table>            
        </div>
    </div>
</div>
