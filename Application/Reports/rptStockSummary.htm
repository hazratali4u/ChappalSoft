<div class="col-md-12" style="display: none;">
    <div id="dvStock" class="tablesorter">
        <style type="text/css">
            * {
                box-sizing: border-box;
            }

            .dvStock {
                padding: 10px 5px;
                font-family: 'Arial', sans-serif;
                font-size: 13px;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                text-align: left;
                margin-left: 10px;
                margin-right: 10px;
            }

                .dvStock h5 {
                    margin: 5px 0;
                    font-size: 14px;
                }
                .dvStock h6 {
                    margin: 5px 0;
                    font-size: 12px;
                }

                .dvStock hr {
                    margin: 0;
                    border: 1px solid black;
                }

                .dvStock .detail-section {
                    margin: 5px 0;
                }

                    .dvStock .detail-section table {
                        width: 100%;
                    }

                        .dvStock .detail-section table tr td {
                            font-size: 12px;
                            font-weight: bold;
                            border: 1px solid black;
                            padding: 5px;
                            text-transform: capitalize;
                        }

                .dvStock label {
                    display: inline;
                }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            h1, h2, h3, h4, h5, h6 {
                font-weight: bold;
                line-height: 1.1;
                color: #000;
                text-transform: capitalize;
            }

            @media print {
                body, html {
                    margin: 0;
                    padding: 0;
                }

                .dvStock {
                    padding: 0;
                    margin-left: 10px; /* <-- ensures left alignment */
                    margin-right: 10px;
                    text-align: left;
                }
            }
        </style>

        <div class="dvStock">
            <table>
                <tr>
                    <td style="width: 100%;text-align:center;" colspan="2">
                        <h3><label id="lblHeaderStock"></label></h3>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;">
                        <h5><label id="lblCategoryStock"></label></h5>
                    </td>
                    <td style="width: 50%;text-align:right;">
                        <h5><label id="lblFromDateStock"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;">
                        <h5><label id="lblItemStock"></label></h5>
                    </td>
                    <td style="width: 50%;text-align:right;">
                        <h5><label id="lblToDateStock"></label></h5>
                    </td>
                </tr>
            </table>
            <br />
            <table style="border-collapse: collapse; width: 100%;" id="tblStockSummary">
                <thead>
                    <tr>
                        <td style="width:40%;border: 1px solid black;">
                            <h5>Item Name</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Opening Stock</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Purchased</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Sold</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Closing Stock</h5>
                        </td>
                    </tr>
                </thead>
                <tbody id="itemDetailStock"></tbody>
                <tr>
                    <td style="width:40%;border: 1px solid black;text-align:right;">
                        <h4>Total</h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblOpeningStockSummary">0</label></h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblPurchaseStockSummary">0</label></h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblSaleStockSummary">0</label></h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblClosingStockSummary">0</label></h4>
                    </td>
                </tr>     
            </table>
            <table style="border-collapse: collapse; width: 100%;" id="tblStockDetail">
                <thead>
                    <tr>
                        <td style="width:30%;border: 1px solid black;">
                            <h5>Item Name</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Color</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Size</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Opening Stock</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Purchased</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Sold</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Closing Stock</h5>
                        </td>
                    </tr>
                </thead>
                <tbody id="itemDetailStockDetail"></tbody>
                <tr>
                    <td style="width:30%;border: 1px solid black;text-align:right;">
                        <h4>Total</h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;">
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblOpeningStockDetail">0</label></h4>
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblPurchaseStockDetail">0</label></h4>
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblSaleStockDetail">0</label></h4>
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblClosingStockDetail">0</label></h4>
                    </td>
                </tr>
            </table>
            <table style="border-collapse: collapse; width: 100%;" id="tblItemProfit">
                <thead>
                    <tr>
                        <td style="width:40%;border: 1px solid black;">
                            <h5>Item Name</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Color</h5>
                        </td>
                        <td style="width:15%;border: 1px solid black;">
                            <h5>Size</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Quantity</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Amount</h5>
                        </td>
                        <td style="width:10%;border: 1px solid black;">
                            <h5>Profit</h5>
                        </td>                        
                    </tr>
                </thead>
                <tbody id="itemDetailItemProfit"></tbody>
                <tr>
                    <td style="width:40%;border: 1px solid black;text-align:right;">
                        <h4>Total</h4>
                    </td>
                    <td style="width:15%;border: 1px solid black;text-align:right;"></td>
                    <td style="width:15%;border: 1px solid black;text-align:right;"></td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblQtyItemProfit">0</label></h4>
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblAmountItemProfit">0</label></h4>
                    </td>
                    <td style="width:10%;border: 1px solid black;text-align:right;">
                        <h4><label id="lblProfitItemProfit">0</label></h4>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
