<div class="col-md-12" style="display: none;">
    <div id="dvPrintOrder" class="tablesorter">
        <style type="text/css">
            * {
                box-sizing: border-box;
            }

            .dvPrintOrder {
                padding: 50px 45px;
                font-family: 'Arial', sans-serif;
                font-size: 13px;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                text-align: left;
                margin-left: 130px;
                margin-right: 130px;
            }

                .dvPrintOrder h5 {
                    margin: 5px 0;
                    font-size: 17px;
                }
                .dvPrintOrder h6 {
                    margin: 5px 0;
                    font-size: 12px;
                }

                .dvPrintOrder hr {
                    margin: 0;
                    border: 1px solid black;
                }

                .dvPrintOrder .detail-section {
                    margin: 5px 0;
                }

                    .dvPrintOrder .detail-section table {
                        width: 100%;
                    }

                        .dvPrintOrder .detail-section table tr td {
                            font-size: 12px;
                            font-weight: bold;
                            border: 1px solid black;
                            padding: 5px;
                            text-transform: capitalize;
                        }

                .dvPrintOrder label {
                    display: inline;
                }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            h1, h2, h3, h4, h5, h6 {
                font-weight: bold;
                line-height: 1.1;
                color: #000;
                text-transform: capitalize;
            }

            @media print {
                body, html {
                    margin: 0;
                    padding: 0;
                }

                .dvPrintOrder {
                    padding: 0;
                    margin-left: 10px; /* <-- ensures left alignment */
                    margin-right: 10px;
                    text-align: left;
                }
            }
        </style>
        <div class="dvPrintOrder">
            <table style="display:none;">
                <tr>
                    <td style="width: 50%;">
                        <h1>
                            <img src="assets/images/logonew.png" width="100" height="100" alt="Logo" />
                        </h1>
                    </td>
                    <td style="width: 50%;">
                        <table style="width:100%;">
                            <tr>
                                <td style="width:10%;">
                                    <img src="assets/images/map.png" width="20" height="20" />
                                </td>
                                <td style="width:90%;">
                                    <h5><label id="lblAddress"></label></h5>
                                </td>
                            </tr>
                            <tr>
                                <td style="width:10%;">
                                    <img src="assets/images/phone.png" width="20" height="20" />
                                </td>
                                <td style="width:90%;">
                                    <h5><label id="lblPhone"></label></h5>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <br />
            <table>
                <tr id="trDuplicateBill">
                    <td style="width:20%;"></td>
                    <td style="width:30%; text-align:center; border:1px solid black;">
                        <h5>DUPLICATE BILL</h5>
                    </td>
                    <td style="width:50%;"></td>
                </tr>
            </table>                        
            <br id="br1"/>
            <br id="br2"/>
            <br />
            <table>
                <tr style="display:none;">
                    <td style="width:45%;background-color:black;">
                        <h5 style="color:white;">BILL TO</h5>
                    </td>
                    <td style="width:5%;"></td>
                    <td style="width:25%;background-color:black;">
                        <h5 style="color:white;">INVOICE #</h5>
                    </td>
                    <td style="width:28%;background-color:black;">
                        <h5 style="color:white;">DATE</h5>
                    </td>
                </tr>
                <tr>
                    <td style="width:45%;">
                        <h5>Name: <label id="lblCustomerName" style="text-decoration:underline;"></label></h5>
                    </td>
                    <td style="width:5%;"></td>
                    <td style="width:25%;">
                        <h5>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<label id="lblInvocieNo"></label></h5>
                    </td>
                    <td style="width:28%;">
                        <h5><label id="lblDate"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width:45%;">
                        <h5>Phone: <label id="lblCustomerPhone" style="text-decoration:underline;"></label></h5>
                    </td>
                    <td style="width:5%;"></td>
                    <td style="width:25%;"></td>
                    <td style="width:28%;"></td>
                </tr>
            </table>
            <br />
            <br />
            <br />
            <br id="br3"/>
            <div class="detail-section">
                <table>
                    <thead style="display:none;">
                        <tr>
                            <td style="width:50%;background-color:black;" align="center"><h4 style="color:white;">DESCRIPTION</h4></td>
                            <td style="width:10%;background-color:black;" align="right"><h4 style="color:white;">QTY</h4></td>
                            <td style="width:20%;background-color:black;" align="right"><h4 style="color:white;">PRICE</h4></td>
                            <td style="width:20%;background-color:black;" align="right"><h4 style="color:white;">AMOUNT</h4></td>
                        </tr>
                    </thead>
                    <tbody id="orderDetail"></tbody>
                    <tr>
                        <td style="width:35%;background-color:silver;" align="right"><h4>TOTAL</h4></td>
                        <td style="width:15%;background-color:silver;" align="right"><h4><label id="lblTotalQTY">0</label></h4></td>
                        <td style="width:25%;background-color:silver;" align="right"></td>
                        <td style="width:25%;background-color:silver;" align="right"><h4> <label id="lblTotalAMOUNT">0</label> </h4></td>
                    </tr>
                    <tr id="trDiscount" style="display:none;">
                        <td style="width:35%;background-color:silver;" align="right"><h4>DISCOUNT</h4></td>
                        <td style="width:15%;background-color:silver;" align="right"></td>
                        <td style="width:25%;background-color:silver;" align="right"></td>
                        <td style="width:25%;background-color:silver;" align="right"><h4> <label id="lblTotalDiscount">0</label> </h4></td>
                    </tr>
                    <tr id="trNetTotal" style="display:none;">
                        <td style="width:35%;background-color:silver;" align="right"><h4>NET TOTAL</h4></td>
                        <td style="width:15%;background-color:silver;" align="right"></td>
                        <td style="width:25%;background-color:silver;" align="right"></td>
                        <td style="width:25%;background-color:silver;" align="right"><h4> <label id="lblInvoiceNetTotal">0</label> </h4></td>
                    </tr>
                </table>
            </div>
            <br />
            <br />
            <br />
            <br />
            <table>
                <tr>
                    <td style="width: 50%;text-align:right;"></td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label>PREVIOUS BALANCE </label></h5>
                    </td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label id="lblCustomerBalance"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;text-align:right;"></td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label>SUB TOTAL </label></h5>
                    </td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label id="lblSubTotal"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;text-align:right;"></td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label>RECEIVED</label></h5>
                    </td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;">
                        <h5><label id="lblReceived"></label></h5>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%;text-align:right;"></td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;background-color:silver;">
                        <h5><label>CURRENT BALANCE </label></h5>
                    </td>
                    <td style="width: 25%;text-align:right;border: 1px solid black;background-color:silver;">
                        <h5><label id="lblTotalBalance"></label></h5>
                    </td>
                </tr>
            </table>
            <br />
            <table style="display:none;">
                <tr>
                    <td style="width: 100%;">
                        <h5><label id="lblInvoiceFooterNote"></label></h5>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
